[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-intelligence"
version = "0.1.0"
description = "Personal news intelligence and monitoring agent"
requires-python = ">=3.12"
dependencies = [
    "feedparser",
    "pyyaml"
    "psycopg[binary]"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
news-intelligence = "news_intelligence.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
